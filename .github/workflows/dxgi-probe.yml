name: DXGI probe

on:
  push:
    branches: [dxgi-probe]
  workflow_dispatch:

jobs:
  windows:
    name: ${{ matrix.os }} ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: i686-pc-windows-msvc }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-C debuginfo=0 --deny warnings"
    steps:
    - uses: actions/checkout@v6
    - uses: hecrj/setup-rust-action@v2
      if: matrix.os != 'windows-11-arm'
      with:
        rust-version: stable
        targets: ${{ matrix.target }}
        components: clippy
    - name: Install Rust on arm64
      if: matrix.os == 'windows-11-arm'
      shell: bash
      run: |
        if ! command -v rustup; then
          curl -sSf -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
          ./rustup-init.exe -y --default-toolchain none --profile minimal
          cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup toolchain install stable --profile minimal --component clippy --target ${{ matrix.target }}
        rustup default stable
    - name: Tests, as upstream CI runs them
      shell: bash
      run: cargo test --verbose --target ${{ matrix.target }} --lib
    - name: Probe
      shell: bash
      run: cargo test --target ${{ matrix.target }} --lib probe -- --ignored --nocapture --test-threads=1
    - name: Window tests five more times
      shell: bash
      run: |
        for i in 1 2 3 4 5; do cargo test --target ${{ matrix.target }} --lib backends::win32::tests:: || exit 1; done
    - name: Clippy
      shell: bash
      run: cargo clippy --all-targets --target ${{ matrix.target }} -- -Dwarnings
